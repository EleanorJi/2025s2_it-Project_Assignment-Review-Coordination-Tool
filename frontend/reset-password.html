<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assignment Moderation Tool – Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <h1>HPS302 Assignment Moderation Tool</h1>
      </div>

      <form class="form" id="resetPasswordForm" novalidate>
        <h2 id="formTitle">Reset Password</h2>

        <!-- Email field (first - shown for logged in users or not logged in without token) -->
        <div class="row" id="emailRow">
          <label for="email">Email Address</label>
          <input id="email" type="email" class="input" placeholder="Enter your email address" autocomplete="email" />
          <div class="help">Enter the email address associated with your account</div>
        </div>

        <!-- Current password field (second - only shown when logged in) -->
        <div class="row" id="currentPasswordRow" style="display: none;">
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" type="password" class="input" placeholder="Enter your current password" autocomplete="current-password" />
          <div class="help">Enter your current password to verify your identity</div>
        </div>

        <!-- Forgot Password link (only shown when logged in) -->
        <div class="inline" id="forgotPasswordRow" style="display: none;">
          <div></div>
          <button class="link" type="button" id="forgotPassword">Forgot password?</button>
        </div>

        <div class="row">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" class="input" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
          <div class="help">Password must be at least 8 characters</div>
        </div>

        <div class="row">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" class="input" placeholder="Re-enter your password" autocomplete="new-password" required minlength="8" />
          <div class="help">Must match the password above</div>
        </div>

        <button class="btn" id="resetBtn">Reset Password</button>
        <div class="msg" id="status"></div>
      </form>

      <div class="inline" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--panel-border);">
        <a href="#" id="backToSignupLink" class="link">← Back to Sign Up</a>
      </div>

      <div class="footer-left">HPS302</div>
      <div class="footer-right">Assignment Moderation Tool</div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('resetPasswordForm');
        const statusDiv = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const formTitle = document.getElementById('formTitle');
        const currentPasswordInput = document.getElementById('currentPassword');
        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const currentPasswordRow = document.getElementById('currentPasswordRow');
        const emailRow = document.getElementById('emailRow');
        const backToSignupLink = document.getElementById('backToSignupLink');
        const forgotPasswordRow = document.getElementById('forgotPasswordRow');
        const forgotPasswordBtn = document.getElementById('forgotPassword');

        // Check if user is logged in
        const userStr = localStorage.getItem('user');
        const isLoggedIn = !!userStr;
        
        // Get token from URL (for forgot password flow)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Configure form based on context
        if (isLoggedIn && !token) {
            // User is logged in and wants to change password
            formTitle.textContent = 'Change Password';
            resetBtn.textContent = 'Change Password';
            emailRow.style.display = 'block';
            emailInput.disabled = true; // Lock email field
            currentPasswordRow.style.display = 'block';
            forgotPasswordRow.style.display = 'flex'; // Show forgot password link
            currentPasswordInput.required = true;
            emailInput.required = false;
            
            // Set user's email from localStorage
            try {
                const userData = JSON.parse(userStr);
                console.log('User data from localStorage:', userData);
                if (userData && userData.email) {
                    emailInput.value = userData.email;
                } else {
                    console.error('User email not found in localStorage:', userData);
                }
            } catch (e) {
                console.error('Error parsing user data:', e);
            }
            
            // Configure back button for logged in users
            const userRole = localStorage.getItem('userRole');
            if (userRole === 'coordinator' || userRole === 'COORDINATOR') {
                backToSignupLink.href = '/dashboard/coordinator';
                backToSignupLink.textContent = '← Back to Dashboard';
            } else if (userRole === 'marker' || userRole === 'MARKER') {
                backToSignupLink.href = '/dashboard/marker';
                backToSignupLink.textContent = '← Back to Dashboard';
            } else {
                backToSignupLink.href = '/login';
                backToSignupLink.textContent = '← Back to Login';
            }
        } else if (token) {
            // User clicked forgot password link
            formTitle.textContent = 'Reset Password';
            resetBtn.textContent = 'Reset Password';
            emailRow.style.display = 'none';
            currentPasswordRow.style.display = 'none';
            forgotPasswordRow.style.display = 'none';
            currentPasswordInput.required = false;
            emailInput.required = false;
            backToSignupLink.href = '/login';
            backToSignupLink.textContent = '← Back to Login';
        } else {
            // User wants to reset password but not logged in
            formTitle.textContent = 'Reset Password';
            resetBtn.textContent = 'Send Reset Link';
            emailRow.style.display = 'block';
            currentPasswordRow.style.display = 'none';
            forgotPasswordRow.style.display = 'none';
            emailInput.disabled = false; // Enable email field
            currentPasswordInput.required = false;
            emailInput.required = true;
            backToSignupLink.href = '/login';
            backToSignupLink.textContent = '← Back to Login';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const currentPassword = currentPasswordInput.value;
            const email = emailInput.value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate password
            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters long.', 'err');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'err');
                return;
            }

            // Validate email if required
            if (emailRow.style.display !== 'none' && !email) {
                showMessage('Please enter your email address.', 'err');
                return;
            }

            // Validate current password if required
            if (currentPasswordRow.style.display !== 'none' && !currentPassword) {
                showMessage('Please enter your current password.', 'err');
                return;
            }

            // Disable button to prevent duplicate submissions
            resetBtn.disabled = true;
            resetBtn.textContent = isLoggedIn && !token ? 'Changing...' : 'Processing...';
            statusDiv.textContent = '';
            statusDiv.className = 'msg';

            try {
                let response;
                let requestBody;

                if (isLoggedIn && !token) {
                    // Change password for logged-in user
                    response = await fetch('/api/auth/change-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            currentPassword: currentPassword,
                            newPassword: newPassword
                        })
                    });
                } else if (token) {
                    // Reset password with token
                    response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token: token,
                            newPassword: newPassword
                        })
                    });
                } else {
                    // Send reset link
                    response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email
                        })
                    });
                }

                const data = await response.json();

                if (data.success) {
                    if (isLoggedIn && !token) {
                        showMessage('Password changed successfully! Redirecting to dashboard...', 'ok');
                        setTimeout(() => {
                            // Determine dashboard based on user role
                            const userRole = localStorage.getItem('userRole');
                            if (userRole === 'coordinator' || userRole === 'COORDINATOR') {
                                window.location.href = '/dashboard/coordinator';
                            } else if (userRole === 'marker' || userRole === 'MARKER') {
                                window.location.href = '/dashboard/marker';
                            } else {
                                window.location.href = '/login';
                            }
                        }, 2000);
                    } else if (token) {
                        showMessage(data.message + ' Redirecting to login...', 'ok');
                        form.style.display = 'none';
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 3000);
                    } else {
                        showMessage('Password reset link sent to your email!', 'ok');
                        form.style.display = 'none';
                    }
                } else {
                    showMessage(data.message, 'err');
                    resetBtn.disabled = false;
                    resetBtn.textContent = isLoggedIn && !token ? 'Change Password' : (token ? 'Reset Password' : 'Send Reset Link');
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'err');
                resetBtn.disabled = false;
                resetBtn.textContent = isLoggedIn && !token ? 'Change Password' : (token ? 'Reset Password' : 'Send Reset Link');
            }
        });

        function showMessage(text, type) {
            statusDiv.textContent = text;
            statusDiv.className = `msg ${type}`;
        }

        // Real-time password match validation
        confirmPasswordInput.addEventListener('input', function() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = this.value;

            if (confirmPassword && newPassword !== confirmPassword) {
                this.style.borderColor = '#DC2626';
            } else {
                this.style.borderColor = '#E5E7EB';
            }
        });

        // Clear error state when user starts typing
        [newPasswordInput, confirmPasswordInput, currentPasswordInput, emailInput].forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = '#E5E7EB';
                statusDiv.textContent = '';
                statusDiv.className = 'msg';
            });
        });

        // Forgot password button click handler
        if (forgotPasswordBtn) {
            forgotPasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = '/forgot-password';
            });
        }
    });
  </script>
</body>
</html>
