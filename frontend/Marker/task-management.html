<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Deakin Moderation – Task Management</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- 复用coordinator的 Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Marker/task-management.css">

</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">HPS302 Assignment Moderation Tool</div>
    </div>
    <div class="account dropdown">
      <span id="username" class="dropdown-trigger"></span><span class="caret">▾</span>
      <div class="dropdown-menu">
        <a href="#" class="dropdown-item" onclick="goToResetPassword()">Reset Password</a>
        <a href="#" class="dropdown-item" onclick="logout()">Logout</a>
      </div>
    </div>
  </header>

  <div class="tm-shell">
    <!-- Sidebar（与marker dashboard保持一致） -->
    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-item" href="/dashboard/marker">Overview</a>
        <a class="nav-item active" aria-current="page" href="/dashboard/marker/taskManagement">Task Management</a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <section class="tm-panel">
        <div class="tm-header">
          <h1>Task Management</h1>
        </div>

        <!-- Task Sections Container -->
        <div id="taskSections" class="tm-sections">
          <!-- JS 动态生成任务区域 -->
        </div>
      </section>
    </main>
  </div>

  <script src="/Marker/task-management.js" defer></script>
</body>
</html>
