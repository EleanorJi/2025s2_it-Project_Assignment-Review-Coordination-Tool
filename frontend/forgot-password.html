<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assignment Moderation Tool – Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <h1>HPS302 Assignment Moderation Tool</h1>
      </div>

      <form class="form" id="forgotPasswordForm" novalidate>
        <h2>Forgot Password</h2>

        <div class="row">
          <label for="email">Email Address</label>
          <input id="email" type="email" class="input" placeholder="name@deakin.edu.au" autocomplete="email" required />
          <div class="help">Enter your registered email address to receive a password reset link</div>
        </div>

        <button class="btn" id="submitBtn">Send Reset Link</button>
        <div class="msg" id="status"></div>
      </form>

      <div class="inline" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--panel-border);">
        <a href="/login" class="link">← Back to Login</a>
      </div>

      <div class="footer-left">HPS302</div>
      <div class="footer-right">Assignment Moderation Tool</div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('forgotPasswordForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');

        // Check if user is logged in and pre-fill email
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const userData = JSON.parse(userStr);
                if (userData && userData.email) {
                    emailInput.value = userData.email;
                    emailInput.disabled = true; // Lock the email field
                }
            } catch (e) {
                console.error('Error parsing user data:', e);
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();

            // Basic email validation
            if (!email) {
                showMessage('Please enter your email address.', 'err');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'err');
                return;
            }

            // Disable button to prevent duplicate submissions
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusDiv.textContent = '';
            statusDiv.className = 'msg';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Please check your email inbox and spam folder.', 'ok');
                    emailInput.value = '';
                } else {
                    showMessage(data.message, 'err');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            } catch (error) {
                showMessage('An error occurred. Please check your connection and try again.', 'err');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }

            // Re-enable button after 5 seconds if success
            if (submitBtn.disabled) {
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }, 5000);
            }
        });

        function showMessage(text, type) {
            statusDiv.textContent = text;
            statusDiv.className = `msg ${type}`;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Real-time email validation
        emailInput.addEventListener('blur', function() {
            const email = this.value.trim();
            if (email && !isValidEmail(email)) {
                this.style.borderColor = '#DC2626';
            } else {
                this.style.borderColor = '#E5E7EB';
            }
        });

        // Clear error state when user starts typing
        emailInput.addEventListener('input', function() {
            this.style.borderColor = '#E5E7EB';
            statusDiv.textContent = '';
            statusDiv.className = 'msg';
        });
    });
  </script>
</body>
</html>
