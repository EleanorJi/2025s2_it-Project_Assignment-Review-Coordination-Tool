cat > .github/workflows/project-automation.yml << 'EOF'
name: Project Board Automation

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed, merged, ready_for_review]

jobs:
  project-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Move new user stories to Sprint Backlog
        if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'user-story')
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Sprint Board
          column: Sprint Backlog
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move epics to Epic Board
        if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'epic')
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Epic Board
          column: Epic In Progress
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move PR to Code Review
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Sprint Board
          column: Code Review
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move merged PR to Testing
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Sprint Board
          column: Testing
          repo-token: ${{ secrets.GITHUB_TOKEN }}
EOF