name: CI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run backend tests
      working-directory: ./backend
      run: npm run test:ci
      
    - name: Upload backend coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/coverage-final.json
        flags: backend
        name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test:ci
      
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Check file structure
      run: |
        echo "✅ Checking project structure..."
        ls -la
        echo "✅ Backend files:"
        ls -la backend/src/
        echo "✅ Frontend files:"
        ls -la frontend/
        
    - name: Verify test files exist
      run: |
        echo "🧪 Checking backend tests..."
        find backend -name "*.test.js" -o -name "*.spec.js"
        echo "🧪 Checking frontend tests..."
        find frontend -name "*.test.js" -o -name "*.spec.js"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, lint]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "✅ All tests completed!"
        echo "Backend tests: ${{ needs.backend-tests.result }}"
        echo "Frontend tests: ${{ needs.frontend-tests.result }}"
        echo "Lint check: ${{ needs.lint.result }}"
        
    - name: Verify all passed
      if: needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.lint.result == 'success'
      run: |
        echo "🎉 All checks passed successfully!"
        exit 0
        
    - name: Report failure
      if: needs.backend-tests.result != 'success' || needs.frontend-tests.result != 'success' || needs.lint.result != 'success'
      run: |
        echo "❌ Some checks failed"
        exit 1

