cat > .github/ISSUE_TEMPLATE/user_story.yml << 'EOF'
name: User Story
description: Create a new user story
title: "[STORY] "
labels: ["user-story", "needs-estimation"]
body:
  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Use standard format "As a..., I want..., so that..."
      placeholder: |
        **As a** coordinator,
        **I want to** upload a rubric document,
        **So that** markers can use consistent scoring criteria.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Specific acceptance criteria
      placeholder: |
        **Given** I am a logged-in coordinator
        **When** I navigate to the rubric management page
        **Then** I should see an upload button
    validations:
      required: true

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: Completion criteria checklist
      options:
        - label: "Feature implemented according to requirements"
        - label: "Code review completed"
        - label: "Unit test coverage > 80%"
        - label: "Integration tests passing"
        - label: "Manual testing completed"
        - label: "API documentation updated"
        - label: "User acceptance testing passed"

  - type: dropdown
    id: story_points
    attributes:
      label: Story Points
      description: Complexity estimation
      options:
        - "1 (Very Simple)"
        - "2 (Simple)"
        - "3 (Medium)"
        - "5 (Complex)"
        - "8 (Very Complex)"
        - "13 (Requires breakdown)"
    validations:
      required: true
EOF