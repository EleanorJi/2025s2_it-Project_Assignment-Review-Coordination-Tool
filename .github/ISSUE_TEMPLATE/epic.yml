# 创建 Epic 模板文件
cat > .github/ISSUE_TEMPLATE/epic.yml << 'EOF'
name: Epic
description: Create a new epic-level feature
title: "[EPIC] "
labels: ["epic", "needs-breakdown"]
body:
  - type: textarea
    id: epic_description
    attributes:
      label: Epic Description
      description: Detailed description of this major feature module
      placeholder: |
        ## Feature Overview
        Describe the business problem and value this Epic will solve
        
        ## User Value
        - Provides coordinators with...
        - Provides markers with...
        - Provides system with...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Epic Acceptance Criteria
      description: Criteria for Epic completion
      placeholder: |
        - [ ] Main feature 1 completed
        - [ ] Main feature 2 completed
        - [ ] All child user stories completed
        - [ ] Integration tests passing
        - [ ] User acceptance testing passed
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (Must Have)
        - Medium (Should Have)  
        - Low (Could Have)
    validations:
      required: true

  - type: input
    id: story_points
    attributes:
      label: Story Points
      description: Estimated total story points (13, 21, 34, 55)
      placeholder: "21"

  - type: dropdown
    id: team
    attributes:
      label: Primary Team
      options:
        - Frontend
        - Backend
        - Database
        - DevOps
        - Full-Stack (Cross-team)
EOF