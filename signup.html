<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Deakin Moderation – Sign up</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles copy.css" />
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <img class="logo-img" src="./deakin-logo.png" alt="Deakin University logo" />
        <h1>Deakin Moderation</h1>
      </div>

      <form class="form" id="signupForm" novalidate>
        <h2>Complete your registration</h2>

        <!-- Invitation banner -->
        <div class="banner" id="inviteBanner" hidden>
          <div class="dot" aria-hidden="true"></div>
          <div>
            <div class="text" id="inviteText">You were invited to join moderation.</div>
            <div class="small" id="inviteScope"></div>
          </div>
        </div>

        <div class="row">
          <label for="email">Email (from invitation)</label>
          <input id="email" class="input" disabled />
        </div>

        <div class="row">
          <label for="name">Full name</label>
          <input id="name" class="input" placeholder="Jane Appleseed" autocomplete="name" />
        </div>

        <div class="row">
          <label for="password">Password</label>
          <input id="password" type="password" class="input" placeholder="At least 8 characters" autocomplete="new-password" />
        </div>

        <div class="row">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" class="input" placeholder="Repeat your password" autocomplete="new-password" />
        </div>

        <label class="inline-left" style="margin-top:6px">
          <input type="checkbox" id="agree" /> I agree to the terms of use
        </label>

        <button class="btn" id="btn">Sign up</button>
        <div class="msg" id="status"></div>
        <div class="small"><a class="link" href="/">Back to sign in</a></div>
      </form>

      <div class="footer-left">© 2025 Deakin University</div>
      <div class="footer-right">Psychology · Calibration Portal</div>
    </section>
  </div>

  <script src="./signup.js" defer></script>
</body>
</html>
