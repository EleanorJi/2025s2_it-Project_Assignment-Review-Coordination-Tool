<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assignment Moderation Tool – Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <h1>HPS302 Assignment Moderation Tool</h1>
      </div>

      <form class="form" id="resetPasswordForm" novalidate>
        <h2>Reset Password</h2>

        <div class="row">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" class="input" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
          <div class="help">Password must be at least 8 characters</div>
        </div>

        <div class="row">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" class="input" placeholder="Re-enter your password" autocomplete="new-password" required minlength="8" />
          <div class="help">Must match the password above</div>
        </div>

        <button class="btn" id="resetBtn">Reset Password</button>
        <div class="msg" id="status"></div>
      </form>

      <div class="inline" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--panel-border);">
        <a href="/login" class="link">← Back to Login</a>
      </div>

      <div class="footer-left">HPS302</div>
      <div class="footer-right">Assignment Moderation Tool</div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('resetPasswordForm');
        const statusDiv = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('Invalid reset link. Please request a new password reset.', 'err');
            form.style.display = 'none';
            return;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate password
            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters long.', 'err');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'err');
                return;
            }

            // Disable button to prevent duplicate submissions
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';
            statusDiv.textContent = '';
            statusDiv.className = 'msg';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Redirecting to login...', 'ok');
                    form.style.display = 'none';
                    // Redirect to login page after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    showMessage(data.message, 'err');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'err');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });

        function showMessage(text, type) {
            statusDiv.textContent = text;
            statusDiv.className = `msg ${type}`;
        }

        // Real-time password match validation
        confirmPasswordInput.addEventListener('input', function() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = this.value;

            if (confirmPassword && newPassword !== confirmPassword) {
                this.style.borderColor = '#DC2626';
            } else {
                this.style.borderColor = '#E5E7EB';
            }
        });

        // Clear error state when user starts typing
        newPasswordInput.addEventListener('input', function() {
            this.style.borderColor = '#E5E7EB';
            statusDiv.textContent = '';
            statusDiv.className = 'msg';
        });

        confirmPasswordInput.addEventListener('input', function() {
            statusDiv.textContent = '';
            statusDiv.className = 'msg';
        });
    });
  </script>
</body>
</html>
