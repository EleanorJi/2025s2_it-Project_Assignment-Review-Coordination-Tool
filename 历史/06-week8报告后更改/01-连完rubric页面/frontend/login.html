<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assignment Moderation Tool – Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <h1>HPS302 Assignment Moderation Tool</h1>
      </div>

      <form class="form" id="loginForm" novalidate>
        <h2>Sign in</h2>

        <div class="row">
          <label for="identifier">Email / Username</label>
          <input id="identifier" class="input" placeholder="name@deakin.edu.au" autocomplete="username" />
        </div>

        <div class="row">
          <label for="password">Password</label>
          <input id="password" type="password" class="input" placeholder="At least 8 characters" autocomplete="current-password" />
          <div class="help">At least 8 characters</div>
        </div>

        <div class="inline">
          <label class="inline-left">
            <input id="remember" type="checkbox" checked>
            Remember me (7 days)
          </label>
          <button class="link" type="button" id="forgot">Forgot password?</button>
        </div>

        <button class="btn" id="submitBtn">Sign in</button>
        <div class="msg" id="status"></div>
      </form>

      <div class="footer-left">HPS302</div>
      <div class="footer-right">Assignment Moderation Tool</div>
    </section>
  </div>

  <script src="login.js" defer></script>
</body>
</html>
