<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Account created – Deakin Moderation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#F5F7FB; --panel:#fff; --border:#E6EAF2;
      --text:#0F172A; --muted:#6B7280; --btn:#0F172A; --ok:#16A34A;
      --shadow:0 6px 24px rgba(2,6,23,0.06);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font:14px/1.5 Inter,Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    .container{max-width:1100px;margin:48px auto;padding:0 24px}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;
      box-shadow:var(--shadow);padding:24px 56px 56px;position:relative;min-height:600px}
    .header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
    .logo-img{width:28px;height:28px;border-radius:50%;border:1px solid #0F172A;object-fit:contain;background:#fff}
    .brand{font-size:16px;font-weight:700}
    .footer-left{position:absolute;left:24px;bottom:18px;color:var(--muted);font-size:13px}
    .footer-right{position:absolute;right:24px;bottom:18px;color:var(--muted);font-size:13px}

    /* center block */
    .center{max-width:560px;margin:120px auto 0;text-align:center}
    .badge{width:64px;height:64px;border-radius:50%;border:2px solid var(--ok);
      display:grid;place-items:center;margin:0 auto 18px;background:#E6F9EE}
    .badge svg{width:28px;height:28px}
    .title{font-size:44px;font-weight:800;font-style:italic;margin:0 0 8px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
    .btn{display:inline-block;min-width:320px;height:54px;line-height:54px;text-align:center;
      border-radius:12px;background:var(--btn);color:#fff;font-weight:600;text-decoration:none}
    .count{margin-top:10px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="header">
        <img class="logo-img" src="deakin-logo.png" alt="Deakin University logo" />
        <div class="brand">Deakin Moderation</div>
      </div>

      <div class="center">
        <div class="badge" aria-hidden="true">
          <!-- green check -->
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <h1 class="title">You are all set</h1>
        <div class="sub">Your marker account has been created.</div>

        <!-- Sign in button -->
        <a class="btn" id="go-signin" href="/">Sign in</a>
        <div class="count" id="countdown" hidden></div>
      </div>

      <div class="footer-left">© 2025 Deakin University</div>
      <div class="footer-right">Psychology · Calibration Portal</div>
    </section>
  </div>

  <script>
    // 可选：支持 ?s=3 指定几秒后自动跳到登录页（默认不自动跳转）
    const p = new URLSearchParams(location.search);
    const seconds = Number(p.get('s') || 0);  // 0 = 不自动跳
    const next = p.get('next') || '/';       // 跳转目的地（默认首页/登录页）
    const cd = document.getElementById('countdown');

    document.getElementById('go-signin').href = next;

    if (seconds > 0) {
      cd.hidden = false;
      let t = seconds;
      cd.textContent = `Redirecting to sign in in ${t}s…`;
      const timer = setInterval(() => {
        t -= 1;
        if (t <= 0) { clearInterval(timer); location.href = next; }
        else cd.textContent = `Redirecting to sign in in ${t}s…`;
      }, 1000);
    }
  </script>
</body>
</html>
